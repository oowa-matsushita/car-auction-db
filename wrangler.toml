name = "car-auction-db"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "car-auction-db"
database_id = "019ec975-0d2e-4ac5-a707-73ff6b1e23d9"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "car-auction-pdfs"

[observability]
enabled = true
