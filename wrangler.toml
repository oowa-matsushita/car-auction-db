name = "car-auction-db"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# ダッシュボードで設定した変数（READER など）がデプロイで消されないようにする
keep_vars = true

# 有料プラン：1回の処理で使えるCPU時間を延ばす（PDFのページ分割用）
[limits]
cpu_ms = 120000

[assets]
directory = "./public"
binding = "ASSETS"
# 画面（HTML・JS）もログインの確認を通してから出す
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "car-auction-db"
database_id = "019ec975-0d2e-4ac5-a707-73ff6b1e23d9"

[[r2_buckets]]
binding = "PDFS"
bucket_name = "car-auction-pdfs"

# PDFを1ページずつ裏側で読み取るための列
[[queues.producers]]
binding = "READ_QUEUE"
queue = "car-auction-read"

[[queues.consumers]]
queue = "car-auction-read"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 3

# 毎日 0:05（日本時間）に、無料枠の都合で待たせていたページを読み取りに回す
[triggers]
crons = ["5 15 * * *"]

# Cloudflare の AI（READER = workers-ai / hybrid のとき使用）
[ai]
binding = "AI"

[observability]
enabled = true
